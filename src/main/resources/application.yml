spring:
  application:
    name: lifeos-gateway
  reactor:
    # Reactor copies context values (the correlation ID) into ThreadLocals such as the MDC on every operator.
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lifeos}
          # Keycloak adds this audience to access tokens (audience mapper on client lifeos-mobile).
          audiences: ${JWT_AUDIENCES:lifeos-api}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000      # ms
            response-timeout: 10s      # default for every route; the coach stream route turns it off
          routes:
            # Coach chat answers stream over SSE: no circuit breaker (its time limiter would cut the stream),
            # an idle limit between chunks instead. Must be matched before the generic coach route.
            - id: coach-chat-stream
              order: -1
              uri: ${COACH_URI:http://localhost:8082}
              predicates:
                - Path=/api/coach/conversations/*/messages
                - Method=POST
              metadata:
                response-timeout: 60000        # ms until the response headers arrive (the stream itself is not limited)
              filters:
                # No data for this long (the coach sends ": ping" every 15 s) → close the stream with an error event.
                - StreamIdleTimeout=${COACH_STREAM_IDLE_TIMEOUT:60s}
            - id: strategy
              uri: ${STRATEGY_URI:http://localhost:8081}
              predicates:
                - Path=/api/strategy/**
              filters:
                - name: CircuitBreaker
                  args: { name: strategy, fallbackUri: "forward:/fallback/strategy" }
            - id: coach
              uri: ${COACH_URI:http://localhost:8082}
              predicates:
                - Path=/api/coach/**
              filters:
                - name: CircuitBreaker
                  args: { name: coach, fallbackUri: "forward:/fallback/coach" }
            - id: triggers
              uri: ${TRIGGER_URI:http://localhost:8083}
              predicates:
                - Path=/api/triggers/**
              filters:
                - name: CircuitBreaker
                  args: { name: triggers, fallbackUri: "forward:/fallback/triggers" }
            - id: notifications
              uri: ${NOTIFICATION_URI:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args: { name: notifications, fallbackUri: "forward:/fallback/notifications" }

lifeos:
  security:
    # Reachable without a token. Everything else needs a valid JWT.
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
  gateway:
    # Defaults for every route's circuit breaker (Resilience4j).
    circuit-breaker:
      sliding-window-size: 20          # last N calls are evaluated
      minimum-number-of-calls: 10      # no decision before this many calls
      failure-rate-threshold: 50       # % failed calls that opens the breaker
      wait-in-open-state: 10s          # fail fast for this long, then let a few calls probe
      permitted-calls-in-half-open-state: 3
      # Must stay above the HTTP response timeout, so a slow service is reported as 504, not cut by the limiter.
      time-limit: 12s

    # Per-user token buckets in Redis. Off for now (single user, no quota decided); turn on with RATE_LIMIT_ENABLED.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}
      defaults:
        replenish-rate: 10             # requests per second per user, sustained
        burst-capacity: 20             # short burst allowed at once
      routes:
        coach:                         # LLM calls cost money: stricter
          replenish-rate: 1
          burst-capacity: 5
        coach-chat-stream:
          replenish-rate: 1
          burst-capacity: 3

server:
  port: 8080

logging:
  pattern:
    # Every log line carries the request's correlation ID, the same value the services log and return.
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
