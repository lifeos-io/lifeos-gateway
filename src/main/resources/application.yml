spring:
  application:
    name: lifeos-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lifeos}
          # Keycloak adds this audience to access tokens (audience mapper on client lifeos-mobile).
          audiences: ${JWT_AUDIENCES:lifeos-api}

lifeos:
  security:
    # Reachable without a token. Everything else needs a valid JWT.
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info

# Routes, rate limiting and circuit breaker settings will be added once the gateway strategy is defined.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
